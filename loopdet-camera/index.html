<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eeeee7">
<title>LoopDVR · 实时摄像头</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main>
  <header><div><p class="project"><a href="../" aria-label="LoopDVR 项目主页">LoopDVR</a></p><h1><b id="model-name">LoopDet-S</b><span> / </span>Live</h1></div><div class="spec">
    <div>WebGPU<span id="precision"></span></div>
    <div class="selectors">
      <label>任务<select id="task" title="停止后可切换任务">
        <option value="det" selected>目标检测</option>
        <option value="pose">人体姿态</option>
        <option value="seg">实例分割</option>
      </select></label>
      <label>模型输入<select id="model-size" title="停止后可切换输入尺寸">
        <option value="512" selected>512 × 512</option>
        <option value="640">640 × 640</option>
      </select></label>
    </div>
  </div></header>
  <section class="viewer" aria-label="摄像头和模型预测画面">
    <div class="screen" id="screen" hidden><canvas id="frame"></canvas><canvas id="overlay"></canvas></div>
    <div id="idle"><span class="focus" aria-hidden="true"></span><h2 id="task-title">目标检测</h2><p>开启摄像头后，画面将在本机处理。</p></div>
    <span id="lamp" aria-hidden="true"></span>
  </section>
  <section class="controls" aria-label="摄像头控制">
    <button id="toggle" type="button">开启摄像头</button>
    <label for="threshold">置信度阈值 <output id="level" for="threshold">0.50</output>
      <input id="threshold" type="range" min="0.05" max="0.95" step="0.01" value="0.50">
    </label>
    <dl><div><dt>推理帧率</dt><dd><b id="fps">—</b> FPS</dd></div><div><dt>模型推理</dt><dd><b id="latency">—</b> ms</dd></div><div><dt>当前目标</dt><dd id="count">—</dd></div></dl>
  </section>
  <p id="status" role="status">等待开启摄像头</p>
</main>
<script type="module" src="camera.js?v=5"></script>
</body>
</html>
